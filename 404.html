<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Niet Gevonden | JMK Multiclean</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="images/logo.svg">
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #D4908F;
            --pink-light: #F2D0CF;
            --magenta: #C0627E;
            --gray-500: #6B7280;
            --gray-800: #1F2937;
            --gradient: linear-gradient(135deg, #D4908F 0%, #C0627E 100%);
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: #F9FAFB;
            color: var(--gray-800);
            text-align: center;
            padding: 24px;
        }
        .container { max-width: 480px; }
        .error-code {
            font-size: clamp(5rem, 15vw, 8rem);
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 12px;
        }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 12px; }
        p { color: var(--gray-500); line-height: 1.7; margin-bottom: 32px; font-size: 1rem; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 32px; border-radius: 28px;
            font-weight: 600; font-size: 0.95rem;
            text-decoration: none; color: white;
            background: var(--gradient);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(212,144,143,0.4);
        }
        .logo {
            width: 80px; height: 80px;
            border-radius: 50%; object-fit: contain;
            margin: 0 auto 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="images/logo.svg" alt="JMK Multiclean" class="logo">
        <div class="error-code">404</div>
        <h1>Pagina niet gevonden</h1>
        <p>De pagina die u zoekt bestaat niet of is verplaatst. Geen zorgen — we brengen u graag terug naar een schone start.</p>
        <a href="/" class="btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Naar Homepage
        </a>
    </div>
</body>
</html>
